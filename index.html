<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taj</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- the row. three words, placed by measurement, and a readout beside them. -->
<header id="top">
  <nav id="words"></nav>
  <span id="readout"></span>
</header>

<!-- three empty pages. the row switches between them and nothing else happens. -->
<main>
  <section id="page-taj"   class="page"></section>
  <section id="page-works" class="page" hidden></section>
  <section id="page-map"   class="page" hidden></section>
</main>

<div id="file-only" hidden>
  <p><b>taj needs its server.</b></p>
  <p>Opening index.html by double-clicking loads it over <code>file://</code>, where
     the browser refuses to load JavaScript modules.</p>
  <p>In VS Code, open a terminal in this folder and run:</p>
  <pre>python3 serve.py</pre>
  <p>Then go to <a href="http://localhost:8000">http://localhost:8000</a>.</p>
</div>

<script>
  if (location.protocol === 'file:') {
    document.getElementById('file-only').hidden = false;
    document.body.classList.add('blocked');
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
